# Hand PHP files to the PHP 5.3.10 CGI binary.
ScriptAlias /php53-cgi/ /usr/lib/php53-cgi/
<Directory "/usr/lib/php53-cgi">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

Action application/x-httpd-php /php53-cgi/php-cgi
AddType application/x-httpd-php .php
DirectoryIndex index.php index.html

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Uploaded artwork is served as inert static content: no PHP handler here.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .php3 .php4 .php5
    RemoveType .php .phtml .php3 .php4 .php5
    ForceType text/plain
    Require all granted
</Directory>
