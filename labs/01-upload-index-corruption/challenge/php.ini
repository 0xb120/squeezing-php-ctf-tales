; PixelDrop runtime configuration (PHP 5.3.10 CGI)
cgi.force_redirect  = 0
cgi.fix_pathinfo    = 1
expose_php          = Off
display_errors      = Off
display_startup_errors = Off
log_errors          = On
error_log           = /dev/stderr
error_reporting     = E_ALL & ~E_NOTICE & ~E_DEPRECATED
file_uploads        = On
upload_max_filesize = 2M
post_max_size       = 8M
max_file_uploads    = 20
upload_tmp_dir      = /tmp
date.timezone       = UTC
