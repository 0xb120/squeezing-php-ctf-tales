name: phpctf-12-filter-chain-rce

services:
  challenge:
    build: ./challenge
    image: phpctf/12-filter-chain-rce:latest
    ports:
      - "127.0.0.1:8012:80"
    # "no writable files anywhere" is part of the challenge, so make it true:
    # the container filesystem is read-only and only the few paths Apache
    # itself needs are backed by (root-owned) tmpfs.
    read_only: true
    tmpfs:
      - /run:mode=0755,uid=0,gid=0
      - /var/run:mode=0755,uid=0,gid=0
      # note the mode: root-owned, so the web user still cannot write here
      - /tmp:mode=0755,uid=0,gid=0
      # docker's default /dev/shm is 1777; make it root-only too so the
      # "nothing is writable" claim is literally true
      - /dev/shm:mode=0755,uid=0,gid=0
    restart: unless-stopped

  solver:
    image: python:3.12-alpine
    profiles: ["solve"]
    volumes: ["./solve:/solve:ro"]
    working_dir: /solve
    command: ["python", "solve.py", "http://challenge"]
    depends_on: [challenge]
