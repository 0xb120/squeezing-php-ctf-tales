name: phpctf-11-one-line-php

services:
  challenge:
    build: ./challenge
    image: phpctf/11-one-line-php:latest
    ports:
      - "127.0.0.1:8011:80"
    restart: unless-stopped

  solver:
    image: python:3.12-alpine
    profiles: ["solve"]
    volumes: ["./solve:/solve:ro"]
    working_dir: /solve
    command: ["python", "solve.py", "http://challenge"]
    depends_on: [challenge]
