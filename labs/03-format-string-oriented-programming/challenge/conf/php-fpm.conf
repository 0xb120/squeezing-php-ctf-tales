[global]
error_log = /dev/stderr
daemonize = yes
; a segfaulting child is the normal case in this lab - never give up on it
emergency_restart_threshold = 0
process_control_timeout = 5s

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
access.log = /dev/null
clear_env = no
catch_workers_output = yes

; static pool: the exploit kills a worker per probe, so keep a few warm
pm = static
pm.max_children = 8
