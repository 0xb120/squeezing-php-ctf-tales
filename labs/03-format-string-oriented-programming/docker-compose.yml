name: phpctf-03-format-string-oriented-programming

services:
  challenge:
    build: ./challenge
    image: phpctf/03-format-string-oriented-programming:latest
    ports:
      - "127.0.0.1:8003:80"
    # format-string exploitation segfaults php-fpm workers on purpose
    restart: unless-stopped

  solver:
    image: python:3.12-alpine
    profiles: ["solve"]
    volumes: ["./solve:/solve:ro"]
    working_dir: /solve
    command: ["python", "solve.py", "http://challenge"]
    depends_on: [challenge]
