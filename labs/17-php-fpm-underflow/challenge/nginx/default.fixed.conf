# The remediation: refuse to forward anything that is not a real .php file.
server {
    listen 80;
    server_name _;

    root  /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        # nginx resolves the script itself and 404s when it does not exist,
        # so the crafted /index.php/%0A... request never reaches php-fpm.
        try_files $fastcgi_script_name =404;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;

        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
    }
}
