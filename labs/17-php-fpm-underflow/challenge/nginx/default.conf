# The configuration from CVE-2019-11043.  Every line that matters is called out
# in WRITEUP.md; the fixed version lives next door in default.fixed.conf.
server {
    listen 80;
    server_name _;

    root  /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php;
    }

    # (1) anything that contains ".php" followed by "/" or by end-of-URI is
    #     handed to php-fpm - including paths that do not exist on disk
    location ~ [^/]\.php(/|$) {
        # (2) the regexp is anchored with ^ and $, and "." never matches a
        #     newline, so a URI containing %0A simply fails to match and
        #     $fastcgi_path_info stays EMPTY
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        include        fastcgi_params;

        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        # (3) ... and that empty value is forwarded verbatim as PATH_INFO,
        #     after REQUEST_URI, which is what the exploit needs
        fastcgi_param  PATH_INFO        $fastcgi_path_info;

        # (4) no try_files / no -f test: php-fpm gets to decide what exists
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
    }
}
