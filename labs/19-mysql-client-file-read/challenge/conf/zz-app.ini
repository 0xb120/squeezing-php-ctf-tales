; The nightly importer relies on LOAD DATA LOCAL INFILE, so the mysqli client
; is allowed to read local files.  On PHP 7.4 this is the default anyway.
mysqli.allow_local_infile = On

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

file_uploads = On
upload_max_filesize = 1M
post_max_size = 2M
