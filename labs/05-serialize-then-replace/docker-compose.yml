name: phpctf-05-serialize-then-replace

services:
  challenge:
    build: ./challenge
    image: phpctf/05-serialize-then-replace:latest
    ports:
      - "127.0.0.1:8005:80"
    restart: unless-stopped

  solver:
    image: python:3.12.14-alpine
    profiles: ["solve"]
    volumes: ["./solve:/solve:ro"]
    working_dir: /solve
    command: ["python", "solve.py", "http://challenge"]
    depends_on: [challenge]
