; ---------------------------------------------------------------------------
; Lab pinning.  Written down explicitly so the lab behaves identically
; everywhere.  These are NOT simply "the php.ini-development defaults":
;   - display_errors/display_startup_errors match the image's no-ini
;     defaults (php:8.2-apache ships no php.ini at all).
;   - html_errors = On is set by us; the no-ini default is Off.
;   - output_buffering = 0 is the no-ini default, but php.ini-development
;     sets 4096.  This one is load-bearing: with a 4 KiB buffer the startup
;     warning is held back, header() still succeeds and the CSP ships, so
;     the whole lab would not work.  See WRITEUP.md.
; ---------------------------------------------------------------------------

; PHP prints warnings into the response body (docker php:*-apache default,
; and what every "it works on my machine" deployment ends up with).
display_errors         = On
display_startup_errors = On
html_errors            = On
error_reporting        = E_ALL
log_errors             = Off

; No output buffering: the very first byte PHP writes finalises the headers.
output_buffering       = 0
implicit_flush         = Off

; The hash-collision DoS countermeasure (bug #60623, CVE-2011-4885).
max_input_vars         = 1000

; The ReDoS countermeasure. 1000000 is the upstream default.
pcre.backtrack_limit   = 1000000
pcre.recursion_limit   = 100000
