; PluginHub keeps the loader diagnostics visible: operators need to see why a
; plugin refused to initialise.
display_errors        = On
display_startup_errors = Off
error_reporting       = E_ALL
html_errors           = Off
expose_php            = Off
default_socket_timeout = 5

; The registry never serves a parseable WSDL; do not keep failures around.
soap.wsdl_cache_enabled = 0
