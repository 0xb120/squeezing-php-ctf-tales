name: phpctf-06-wordpress-placeholder-injection

services:
  challenge:
    build: ./challenge
    image: phpctf/06-wordpress-placeholder-injection:latest
    ports:
      - "127.0.0.1:8006:80"
    restart: unless-stopped

  solver:
    image: python:3.12.14-alpine
    profiles: ["solve"]
    volumes: ["./solve:/solve:ro"]
    working_dir: /solve
    command: ["python", "solve.py", "http://challenge"]
    depends_on: [challenge]
