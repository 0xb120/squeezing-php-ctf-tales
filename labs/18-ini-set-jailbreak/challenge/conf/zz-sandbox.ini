; ---------------------------------------------------------------------------
; "PHPlayground" hardening profile.
;
; disable_functions is PHP_INI_SYSTEM: it can only be set here, in a php.ini
; file read at startup.  It cannot be relaxed with ini_set() at runtime, and
; Apache's php_admin_value does not work for it either (the disable list is
; consumed once, during module startup).
; ---------------------------------------------------------------------------
disable_functions = system,exec,shell_exec,passthru,popen,pclose,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,pcntl_alarm,pcntl_wait,pcntl_waitpid,pcntl_signal,pcntl_signal_dispatch,dl,symlink,link,posix_mkfifo,posix_setuid,posix_seteuid,posix_setgid,posix_kill,curl_init,curl_setopt,curl_setopt_array,curl_exec,curl_multi_init,curl_multi_add_handle,curl_multi_exec,curl_file_create,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,ftp_connect,ftp_ssl_connect,ftp_get,ftp_fget,ftp_put,imap_open,imap_mail,highlight_file,show_source,php_uname,getmypid,posix_getpwuid

; Uploaded scripts are not allowed to talk to the network at all.
allow_url_fopen  = Off
allow_url_include = Off

; Keep the playground chatty so people can see what the sandbox refuses.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = Off
html_errors = Off

; Playground limits.
max_execution_time = 10
memory_limit = 128M
