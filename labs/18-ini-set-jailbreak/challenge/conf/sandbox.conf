# The playground evaluator lives outside the DocumentRoot, in its own jail.
Alias /sandbox /var/www/sandbox

<Directory /var/www/sandbox>
    Require all granted
    Options -Indexes -FollowSymLinks
    AllowOverride None

    # Confine the sandbox to its own directory.
    #
    # NOTE: this is php_value, not php_admin_value.  Both pin open_basedir for
    # every request under this directory, so they look equivalent in phpinfo()
    # -- but only php_admin_value also drops the directive's access level to
    # PHP_INI_SYSTEM.  With php_value the entry keeps its declared
    # PHP_INI_ALL level and stays writable from ini_set().
    php_value open_basedir /var/www/sandbox/
</Directory>

# The flag is not under any DocumentRoot.
<Directory /var/www/html>
    Require all granted
    Options -Indexes -FollowSymLinks
    AllowOverride None
</Directory>
