<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # ---------------------------------------------------------------------------
    # PHP 5.3.9 predates the CVE-2012-1823 fix (5.3.12), and serving it through
    # mod_actions + CGI means Apache hands a query string with no '=' to php-cgi
    # as command-line arguments. Without this guard, `?-s` dumps the source and
    # `?-d+allow_url_include%3d1+-d+auto_prepend_file%3dphp%3a//input` is RCE --
    # i.e. lab 16's technique would hand you this lab's flag for free.
    #
    # This is the Apache workaround distributions shipped in 2012: refuse any
    # query string that carries no '=' and contains a hyphen (raw or
    # percent-encoded). The intended attack here is a POST body and uses no
    # query string at all, so the lab is unaffected.
    # See labs/16-php-cgi-argument-injection.
    RewriteEngine On
    RewriteCond %{QUERY_STRING} ^[^=]*$
    RewriteCond %{QUERY_STRING} %2d|\- [NC]
    RewriteRule .? - [F,L]

    # The CGI wrapper is only meant to be reached through the Action handler.
    RewriteCond %{THE_REQUEST} ^[A-Z]+\s/php53-cgi/ [NC]
    RewriteRule .? - [F,L]
    # ---------------------------------------------------------------------------
</VirtualHost>
