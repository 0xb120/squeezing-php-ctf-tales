# Hand PHP files to the PHP 5.3.9 CGI binary.
ScriptAlias /php53-cgi/ /usr/lib/php53-cgi/
<Directory "/usr/lib/php53-cgi">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

Action application/x-httpd-php /php53-cgi/php-cgi
AddType application/x-httpd-php .php
DirectoryIndex index.php

<Directory /var/www/html>
    Options -Indexes -Includes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# The exploit needs several dozen requests to land on the same php-cgi heap
# layout, so the connection must survive the whole run.
KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 65
