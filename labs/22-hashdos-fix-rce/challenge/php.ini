; Sticky runtime configuration (PHP 5.3.9 CGI)
cgi.force_redirect     = 0
cgi.fix_pathinfo       = 1
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /dev/stderr
error_reporting        = E_ALL & ~E_NOTICE & ~E_DEPRECATED
; php.ini-production of the era switched this off; it also has to be off for
; the challenge to be solvable, because addslashes() would mangle a binary
; POST value (this is the only ini setting the lab really depends on).
magic_quotes_gpc       = Off
; The star of the show. 1000 is the compiled-in default that PHP 5.3.9
; introduced; it is spelled out here only so the player can see it.
max_input_vars         = 1000
post_max_size          = 8M
memory_limit           = 128M
file_uploads           = Off
date.timezone          = UTC
