# Two interpreters, one document root.
#   /...         -> PHP 5.3.3  (NUL-byte truncation still works)
#   /v534/...    -> PHP 5.3.4  (the release that fixed it)

ScriptAlias /php-cgi533/ /usr/lib/php-cgi533/
ScriptAlias /php-cgi534/ /usr/lib/php-cgi534/

<Directory "/usr/lib/php-cgi533">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>
<Directory "/usr/lib/php-cgi534">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

AddType application/x-httpd-php533 .php
Action application/x-httpd-php533 /php-cgi533/php-cgi
DirectoryIndex index.php index.html

Alias /v534 /var/www/html

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Location /v534>
    RemoveType .php
    AddType application/x-httpd-php534 .php
    Action application/x-httpd-php534 /php-cgi534/php-cgi
</Location>
