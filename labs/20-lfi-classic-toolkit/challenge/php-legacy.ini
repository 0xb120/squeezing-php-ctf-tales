; Museum legacy wing - PHP 5.3.x CGI.
; Everything here is a stock 2010 configuration; nothing is weakened beyond
; what a default install of the day already did.
cgi.force_redirect     = 0
cgi.fix_pathinfo       = 1
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /dev/stderr
error_reporting        = E_ALL & ~E_NOTICE & ~E_DEPRECATED
; magic_quotes_gpc would backslash-escape the NUL byte before it ever reaches
; include(); it was already deprecated in 5.3 and is Off in every modern
; distribution package.
magic_quotes_gpc       = Off
file_uploads           = On
upload_max_filesize    = 2M
post_max_size          = 8M
allow_url_fopen        = Off
allow_url_include      = Off
date.timezone          = UTC
